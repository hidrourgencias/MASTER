# Render Blueprint - Hidrourgencias v2.0
# 1. Ve a render.com -> New -> Blueprint
# 2. Conecta este repositorio
# 3. En Environment, agrega DATABASE_URL (connection string de Neon/Postgres) y JWT_SECRET

services:
  - type: web
    name: hidrourgencias
    runtime: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
